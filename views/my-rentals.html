<!DOCTYPE html>
<html lang="en">
<head><title>My rentals - Northway Rentals</title>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="site-header"><a class="brand" href="/">North<span>way</span> Rentals</a><nav id="nav" aria-label="Main"></nav></header>
<main>
  <div class="section-head"><h2>My rentals</h2><a class="btn primary" href="/">Book another car</a></div>

  <div class="panel" style="margin-bottom:1.2rem">
    <h3>Loyalty membership</h3>
    <p class="muted" id="memText">Loading...</p>
    <div class="filters">
      <div class="field"><label for="memSelect">Change tier</label><select id="memSelect"></select></div>
      <button class="btn" id="memSave" type="button">Update membership</button>
    </div>
    <p class="hint">Demo: tiers apply instantly and the discount is used on your next booking.</p>
  </div>

  <div class="table-wrap">
    <table>
      <thead><tr><th>#</th><th>Vehicle</th><th>Dates</th><th>Route</th><th>Package</th><th>Total</th><th>Rental</th><th>Payment</th><th></th></tr></thead>
      <tbody id="rows"><tr><td colspan="9" class="muted">Loading...</td></tr></tbody>
    </table>
  </div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="/js/app.js"></script>
<script src="/js/rentals.js"></script>
</body>
</html>
