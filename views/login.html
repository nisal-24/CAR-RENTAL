<!DOCTYPE html>
<html lang="en">
<head><title>Log in - Northway Rentals</title>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="site-header"><a class="brand" href="/">North<span>way</span> Rentals</a><nav id="nav" aria-label="Main"></nav></header>
<div class="auth-wrap">
  <div class="auth-card">
    <h2>Log in</h2>
    <p class="muted">Welcome back. Pick up where you left off.</p>
    <div class="form-error" id="err" hidden></div>
    <form id="loginForm" novalidate>
      <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required></div>
      <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div>
      <button class="btn primary" style="width:100%" type="submit">Log in</button>
    </form>
    <p>No account yet? <a href="/register">Create one</a></p>
    <div class="demo"><b>Demo accounts</b> (password: <code>password</code>)<br>admin@carrental.com &middot; kavya@example.com</div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="/js/app.js"></script>
<script>
$(function () {
  loadUser();
  const next = new URLSearchParams(location.search).get('next');
  const safeNext = next && next.startsWith('/') && !next.startsWith('//') ? next : '/';
  $('#loginForm').on('submit', function (e) {
    e.preventDefault();
    $('#err').hide();
    api('POST', '/api/auth/login', { email: $('#email').val().trim(), password: $('#password').val() })
      .done((r) => { location.href = r.user.role === 'admin' && safeNext === '/' ? '/admin' : safeNext; })
      .fail((x) => $('#err').text(errMsg(x)).show());
  });
});
</script>
</body>
</html>
